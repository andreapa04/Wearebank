<div class="gerente-container">
  <div *ngIf="mensaje" class="mensaje success">{{ mensaje }}</div>
  <div *ngIf="error" class="mensaje error">{{ error }}</div>

  <div class="vista-container" style="margin-bottom: 2rem; border-top: 4px solid #dc3545;">
    <h3>⚠️ Solicitudes de Cierre de Cuenta (Clientes)</h3>
    
    <table class="table-responsive" *ngIf="solicitudesCierre.length > 0; else noCierres">
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Cliente</th>
          <th>Email</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let s of solicitudesCierre">
          <td>{{ s.fechaSolicitud | date:'short' }}</td>
          <td>{{ s.nombre }} {{ s.apellidoP }}</td>
          <td>{{ s.email }}</td>
          <td>
            <button class="btn-principal" style="background:#28a745; margin-right:5px;" (click)="procesarCierre(s.idSolicitudCierre, true)">Aprobar</button>
            <button class="btn-peligro" (click)="procesarCierre(s.idSolicitudCierre, false)">Rechazar</button>
          </td>
        </tr>
      </tbody>
    </table>
    <ng-template #noCierres><p>No hay solicitudes de cierre pendientes.</p></ng-template>
  </div>

  <div class="form-container vista-container">
     </div>
  <div class="ejecutivos-section vista-container">
     </div>
</div>
