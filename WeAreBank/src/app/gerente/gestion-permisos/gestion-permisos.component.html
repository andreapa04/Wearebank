<div class="container">
  <h2>Gestión de Permisos para el Rol "Ejecutivo"</h2>
  <p>
    Estos permisos se aplicarán a <strong>todos</strong> los usuarios 
    que tengan el rol de Ejecutivo.
  </p>

  <div *ngIf="mensaje" class="mensaje success">{{ mensaje }}</div>
  <div *ngIf="error" class="mensaje error">{{ error }}</div>

  <table class="permisos-table">
    <thead>
      <tr>
        <th>Permiso</th>
        <th>Descripción</th>
        <th>Habilitado</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of todosLosPermisos">
        <td><strong>{{ p.nombrePermiso }}</strong></td>
        <td>{{ p.descripcion }}</td>
        <td>
          <input 
            type="checkbox" 
            [(ngModel)]="permisosRolEjecutivo[p.idPermiso]"
            name="permiso_{{p.idPermiso}}">
        </td>
      </tr>
    </tbody>
  </table>

  <button class="save-btn" (click)="guardarCambios()">Guardar Cambios</button>
</div>
