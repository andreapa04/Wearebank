<section class="deposito-section">
  <h2>Realizar depósito</h2>

  <div *ngIf="error" class="error-message">{{ error }}</div>
  <div *ngIf="mensaje" class="success-message">{{ mensaje }}</div>

  <div class="form-group">
    <label>Cuenta origen</label>
    <select [(ngModel)]="idCuenta" name="idCuenta">
      <option [ngValue]="null">Seleccionar</option>
      <option *ngFor="let c of cuentas" [ngValue]="c.idCuenta">
        {{ c.tipoCuenta }} • ****{{ c.clabe.slice(-4) }} • Saldo: {{ c.saldo | currency }}
      </option>
    </select>
  </div>

  <div class="form-group">
    <label>Cuenta destino (CLABE o ID)</label>
    <input [(ngModel)]="cuentaDestino" name="cuentaDestino" placeholder="Número de cuenta o CLABE">
</div>

  <div class="form-group">
    <label>Monto</label>
    <input type="number" [(ngModel)]="monto" name="monto" min="0" step="0.01">
  </div>

  <div class="form-group">
    <label>Concepto</label>
    <input [(ngModel)]="concepto" name="concepto">
  </div>

  <div class="button-group">
    <button (click)="depositar()">Depositar</button>
    <button (click)="cancelar()">Cancelar</button>
  </div>
</section>
