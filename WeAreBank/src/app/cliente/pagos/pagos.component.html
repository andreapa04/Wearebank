<div class="container">
  <h2>Pago de servicios</h2>

  <label>Selecciona una cuenta:</label>
  <select [(ngModel)]="idCuentaSeleccionada">
    <option [value]="null">Seleccionar</option>
    <option *ngFor="let cuenta of cuentas" [value]="cuenta.idCuenta">
      {{ cuenta.tipoCuenta }} - CLABE: {{ cuenta.clabe }} - ${{ cuenta.saldo | number:'1.2-2' }}
    </option>
  </select>

  <h3>Servicios disponibles</h3>
  <table>
    <thead>
      <tr>
        <th>Servicio</th>
        <th>Referencia</th>
        <th>Último pago</th>
        <th>Acción</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let servicio of servicios">
        <td>{{ servicio.nombre }}</td>
        <td>{{ servicio.referencia }}</td>
        <td>${{ servicio.ultimoPago }}</td>
        <td><button (click)="pagarServicio(servicio)">Seleccionar</button></td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="montoPago > 0">
    <h3>Confirmar pago</h3>
    <p>Referencia: {{ referencia }}</p>
    <p>Monto: ${{ montoPago | number:'1.2-2' }}</p>
    <button class="submit" (click)="realizarPago()">Pagar</button>
  </div>

  <p *ngIf="mensaje" class="mensaje">{{ mensaje }}</p>
</div>
